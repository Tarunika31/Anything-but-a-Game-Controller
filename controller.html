<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Phone Controller</title><link rel="stylesheet" href="/style.css"></head><body class="controller-body"><main class="phone-shell"><div class="eyebrow">MOTION PLAY LAB</div><h1>Phone <span>Controller</span></h1><p class="sub">Tilt gently to guide the orb.</p><div class="connection-card"><span id="connectionDot" class="dot"></span><span id="connectionText">Connecting…</span><b id="roomLabel"></b></div><div class="tilt-card"><div class="tilt-ball" id="tiltBall">●</div><div class="crosshair"></div></div><div class="sensor-values"><div><small>TILT X</small><strong id="xValue">0.00</strong></div><div><small>TILT Y</small><strong id="yValue">0.00</strong></div><div><small>LATENCY</small><strong id="latencyValue">—</strong></div></div><div class="button-grid"><button id="enableMotion" class="primary">Enable motion</button><button id="calibrate" class="secondary">Calibrate neutral</button><button id="jump" class="jump-button">JUMP</button><button id="reconnect" class="secondary">Reconnect</button></div><p id="sensorMessage" class="hint">Tap Enable motion to allow sensor access. You can also use the on-screen buttons.</p><div class="manual-pad"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><p class="hint">Keep this screen open while playing. Automatic reconnect is enabled.</p></main><script src="/controller.js"></script></body></html>
